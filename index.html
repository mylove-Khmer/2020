<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់អាខោន Facebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .khqr-card {
            width: 290px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            margin: 0 auto;
        }
        .khqr-header {
            background-color: #D61B23;
            padding: 14px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-900 p-5 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">ហាងលក់អាខោន FB</h1>
                    <p class="text-slate-400 text-xs mt-0.5">ប្រព័ន្ធស្វ័យប្រវត្តិ ២៤ម៉ោង</p>
                </div>
                <!-- បង្ហាញព័ត៌មានអ្នក Login -->
                <div id="userProfile" class="hidden text-right">
                    <span id="displayUsername" class="text-xs font-semibold text-emerald-400 block"></span>
                    <button onclick="logout()" class="text-[11px] text-red-400 hover:underline">ចាកចេញ</button>
                </div>
            </div>
        </div>

        <div class="p-6 space-y-5">

            <!-- ផ្ទាំង Login / Register -->
            <div id="authSection" class="space-y-4">
                <div class="flex border-b border-slate-200 mb-4">
                    <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center font-bold text-sm text-red-600 border-b-2 border-red-600">ចូលប្រើប្រាស់</button>
                    <button id="tabRegister" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center font-bold text-sm text-slate-500 hover:text-slate-700">ចុះឈ្មោះគណនី</button>
                </div>

                <!-- Form Login -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ឈ្មោះគណនី (Username)៖</label>
                        <input type="text" id="loginUsername" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">លេខសម្ងាត់ (Password)៖</label>
                        <input type="password" id="loginPassword" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition duration-200 shadow-md">
                        ចូលគណនីដើម្បីទិញ
                    </button>
                </form>

                <!-- Form Register -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ឈ្មោះគណនី (Username)៖</label>
                        <input type="text" id="regUsername" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">លេខទូរស័ព្ទ (Phone Number)៖</label>
                        <input type="tel" id="regPhone" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500" placeholder="012345678">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">លេខសម្ងាត់ (Password)៖</label>
                        <input type="password" id="regPassword" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-lg text-sm transition duration-200 shadow-md">
                        បង្កើតគណនីថ្មី
                    </button>
                </form>
            </div>

            <!-- Form ជ្រើសរើសទំនិញ និងចំនួន (បង្ហាញតែពេល Login រួច) -->
            <div id="buyForm" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ជ្រើសរើសប្រភេទអាខោន៖</label>
                    <select id="productSelect" onchange="calculateTotal()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm text-slate-700 focus:outline-none focus:border-red-500">
                        <option value="1.50" data-name="Facebook Via Cambodia + 2FA">Facebook Via Cambodia + 2FA ($1.50)</option>
                        <option value="0.50" data-name="Facebook Clone ខ្មែរ">Facebook Clone ខ្មែរ ($0.50)</option>
                        <option value="2.00" data-name="Facebook Via USA + 2FA">Facebook Via USA + 2FA ($2.00)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ចំនួនអាខោនចង់ទិញ៖</label>
                    <input type="number" id="qtyInput" min="1" max="500" value="1" oninput="calculateTotal()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:border-red-500">
                </div>

                <div class="p-3 bg-red-50 border border-red-200 rounded-lg flex justify-between items-center">
                    <span class="text-xs text-red-700 font-semibold">តម្លៃសរុបត្រូវបង់៖</span>
                    <span id="totalDisplay" class="text-lg font-black text-red-600">$1.50 USD</span>
                </div>

                <button type="button" id="btnPay" onclick="requestQR()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    បន្តទៅការទូទាត់ (KHQR)
                </button>
            </div>

            <!-- ផ្ទាំង KHQR CARD -->
            <div id="paymentSection" class="hidden border-t border-slate-200 pt-4 space-y-4">
                <div class="khqr-card text-left">
                    <div class="khqr-header">
                        <svg class="h-6 text-white fill-current" viewBox="0 0 100 24">
                            <text x="50%" y="18" font-size="20" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle" fill="#ffffff" letter-spacing="3">KHQR</text>
                        </svg>
                    </div>

                    <div class="p-4 bg-white">
                        <!-- ប្តូរឈ្មោះមកជា «លក់អាខោន» -->
                        <h2 class="text-slate-800 font-semibold text-base leading-tight">លក់អាខោន</h2>
                        <div class="mt-1">
                            <span id="cardAmount" class="text-xl font-bold text-slate-900 tracking-tight">0.00</span>
                            <span class="text-xs font-semibold text-slate-500 ml-1 tracking-wider">USD</span>
                        </div>
                    </div>

                    <div class="border-b border-dashed border-slate-300 w-full"></div>

                    <div class="p-5 flex justify-center bg-white">
                        <div id="qrcode"></div>
                    </div>
                </div>

                <!-- កន្លែង Upload Slip -->
                <div class="text-left max-w-[290px] mx-auto space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Slip បង់ប្រាក់រួច៖</label>
                        <input type="file" id="slipInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 border border-slate-200 rounded-lg p-1">
                    </div>

                    <button type="button" id="btnSubmit" onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow-md text-sm">
                        ផ្ញើវិក្កយបត្រ
                    </button>
                </div>
            </div>

            <!-- កន្លែងរង់ចាំ -->
            <div id="waitingSection" class="hidden text-center p-6 bg-amber-50 border border-amber-200 rounded-xl space-y-3">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full"></div>
                <h3 class="font-bold text-amber-800">កំពុងរង់ចាំ Admin ពិនិត្យវិក្កយបត្រ...</h3>
                <p class="text-xs text-amber-600">សូមកុំទាន់បិទទំព័រនេះ អាខោនទាំងអស់នឹងបង្ហាញនៅទីនេះភ្លាមៗក្រោយការអនុម័ត។</p>
            </div>

            <!-- កន្លែងបង្ហាញអាខោនពេលទិញជោគជ័យ -->
            <div id="resultSection" class="hidden bg-emerald-50 border border-emerald-300 p-5 rounded-xl space-y-3">
                <h3 class="text-lg font-bold text-emerald-800 text-center">🎉 ការទិញបានជោគជ័យ!</h3>
                <p class="text-xs text-slate-600 font-semibold">បញ្ជីអាខោនរបស់អ្នក៖</p>
                <textarea id="accountResult" readonly class="w-full p-3 font-mono text-xs bg-white border border-emerald-300 rounded-lg h-36 text-slate-800"></textarea>
                <button onclick="copyAccount()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition duration-200">
                    Copy អាខោនទាំងអស់
                </button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = '';
        let currentUser = localStorage.getItem('fb_store_user') || null;
        let currentOrderId = '';
        let calculatedTotal = 1.50;
        let selectedQty = 1;
        let pollTimer = null;

        window.onload = function() {
            if (currentUser) {
                showLoggedInState(currentUser);
            }
        };

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('tabLogin').className = "w-1/2 py-2 text-center font-bold text-sm text-red-600 border-b-2 border-red-600";
                document.getElementById('tabRegister').className = "w-1/2 py-2 text-center font-bold text-sm text-slate-500 hover:text-slate-700";
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tabRegister').className = "w-1/2 py-2 text-center font-bold text-sm text-red-600 border-b-2 border-red-600";
                document.getElementById('tabLogin').className = "w-1/2 py-2 text-center font-bold text-sm text-slate-500 hover:text-slate-700";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value.trim();

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, phone })
                });
                const data = await res.json();
                if (data.success) {
                    alert("ចុះឈ្មោះជោគជ័យ! សូម Login ចូលប្រើប្រាស់។");
                    switchAuthTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("មិនអាចភ្ជាប់ទៅ Server បានទេ!");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('fb_store_user', data.username);
                    currentUser = data.username;
                    showLoggedInState(currentUser);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("មិនអាចភ្ជាប់ទៅ Server បានទេ!");
            }
        }

        function showLoggedInState(user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('buyForm').classList.remove('hidden');
            document.getElementById('userProfile').classList.remove('hidden');
            document.getElementById('displayUsername').innerText = `👤 ${user}`;
        }

        function logout() {
            localStorage.removeItem('fb_store_user');
            currentUser = null;
            location.reload();
        }

        function calculateTotal() {
            const unitPrice = parseFloat(document.getElementById('productSelect').value);
            let qty = parseInt(document.getElementById('qtyInput').value);
            if (isNaN(qty) || qty < 1) qty = 1;
            selectedQty = qty;
            calculatedTotal = (unitPrice * qty).toFixed(2);
            document.getElementById('totalDisplay').innerText = `$${calculatedTotal} USD`;
        }

        async function requestQR() {
            calculateTotal();
            currentOrderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);

            const btnPay = document.getElementById('btnPay');
            btnPay.innerText = "កំពុងរៀបចំ QR Code...";
            btnPay.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/create-khqr`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: calculatedTotal, orderId: currentOrderId })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { 
                        text: data.qrString, 
                        width: 220, 
                        height: 220
                    });
                    
                    document.getElementById('cardAmount').innerText = calculatedTotal;

                    document.getElementById('buyForm').classList.add('hidden');
                    document.getElementById('paymentSection').classList.remove('hidden');
                } else {
                    alert("មានបញ្ហាក្នុងការបង្កើត QR Code!");
                    btnPay.innerText = "បន្តទៅការទូទាត់ (KHQR)";
                    btnPay.disabled = false;
                }
            } catch (err) {
                alert("មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!");
                btnPay.innerText = "បន្តទៅការទូទាត់ (KHQR)";
                btnPay.disabled = false;
            }
        }

        async function submitOrder() {
            const slipInput = document.getElementById('slipInput');
            if (!slipInput.files[0]) return alert("សូមជ្រើសរើសរូប Slip!");

            const selectEl = document.getElementById('productSelect');
            const formData = new FormData();
            formData.append('orderId', currentOrderId);
            formData.append('buyerUsername', currentUser || 'ភ្ញៀវ');
            formData.append('productName', selectEl.options[selectEl.selectedIndex].getAttribute('data-name'));
            formData.append('quantity', selectedQty);
            formData.append('totalAmount', calculatedTotal);
            formData.append('slip', slipInput.files[0]);

            document.getElementById('btnSubmit').innerText = "កំពុងបញ្ជូន...";
            document.getElementById('btnSubmit').disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/submit-order`, { method: 'POST', body: formData });
                const result = await res.json();

                if (result.success) {
                    document.getElementById('paymentSection').classList.add('hidden');
                    document.getElementById('waitingSection').classList.remove('hidden');
                    pollTimer = setInterval(checkOrderStatus, 3000);
                }
            } catch (err) {
                alert("មានបញ្ហាក្នុងការផ្ញើទិន្នន័យ!");
                document.getElementById('btnSubmit').disabled = false;
                document.getElementById('btnSubmit').innerText = "ផ្ញើវិក្កយបត្រ";
            }
        }

        async function checkOrderStatus() {
            const res = await fetch(`${BACKEND_URL}/api/check-order/${currentOrderId}`);
            const data = await res.json();

            if (data.status === 'approved') {
                clearInterval(pollTimer);
                document.getElementById('waitingSection').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('accountResult').value = data.account;
            } else if (data.status === 'rejected') {
                clearInterval(pollTimer);
                alert("ការកុម្ម៉ង់ត្រូវបានបដិសេធ ដោយសារវិក្កយបត្រមិនត្រឹមត្រូវ!");
                location.reload();
            }
        }

        function copyAccount() {
            const copyText = document.getElementById("accountResult");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("បាន Copy អាខោនទាំងអស់ជោគជ័យ!");
        }
    </script>
</body>
</html>
